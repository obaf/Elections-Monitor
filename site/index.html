<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>irev2.com &mdash; Under Construction</title>
  <meta name="description" content="irev2.com is under construction.">
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #0b1020;
      --fg: #e8ecf5;
      --muted: #96a0b8;
      --accent: #5b8cff;
      --line: rgba(232, 236, 245, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1100px 620px at 50% -12%, #17203f 0%, transparent 60%), var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 40rem;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      margin-bottom: 1.75rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.15;
      margin: 0 0 1rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.125rem);
      margin: 0 auto;
      max-width: 32rem;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8125rem;
    }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: rise 0.6s ease-out both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">irev2.com</span>
    <h1>Under Construction</h1>
    <p>
      This site is being built. Please check back soon.
    </p>
    <footer>
      Deployed with Terraform &middot; Amazon S3 &middot; CloudFront
    </footer>
  </main>
</body>
</html>
