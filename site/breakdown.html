<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Result breakdown — irev2.com</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="topbar">
  <span id="admin-flag" class="admin-flag" hidden>ADMIN MODE — status and revoke columns are shown</span>
  <a class="btn btn-small" href="/">← back to the portal</a>
  <button id="admin-login-btn" class="btn btn-small">admin login</button>
  <button id="admin-logout-btn" class="btn btn-small" hidden>log out</button>
</div>

<div class="page wide">
  <h1>Breakdown of results</h1>
  <p class="muted" id="intro">Loading…</p>

  <div class="toolbar">
    <label class="grow">
      <span>Search polling unit or ward</span>
      <input id="q" type="search" placeholder="e.g. TOWN HALL IWARA" autocomplete="off">
    </label>
    <label class="chk" id="all-wrap" hidden>
      <input id="show-all" type="checkbox">
      Show every polling unit
    </label>
    <button id="audit-btn" class="btn" hidden>View audit log</button>
  </div>

  <div id="audit" class="audit" hidden></div>

  <div class="scroller">
    <table class="bd">
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot id="foot"></tfoot>
    </table>
  </div>
  <div id="sentinel"></div>
  <p id="more" class="muted"></p>

  <section id="withdrawn" hidden>
    <h2 class="wd-h">Withdrawn results</h2>
    <p class="muted">These results were added and later removed from the totals by an admin.</p>
    <div id="withdrawn-list"></div>
  </section>
</div>

<dialog id="login-dlg" class="dlg">
  <h2>Admin login</h2>
  <p class="muted">Log in to see per-unit status and revoke a result.</p>
  <label class="fld"><span>Username</span>
    <input id="admin-u" type="text" autocomplete="username"></label>
  <label class="fld"><span>Password</span>
    <input id="admin-p" type="password" autocomplete="current-password"></label>
  <p id="login-err" class="login-err" hidden></p>
  <div class="dlg-actions">
    <button id="admin-go" class="btn btn-primary">Log in</button>
    <button class="btn btn-quiet" data-close>Cancel</button>
  </div>
</dialog>

<dialog id="revoke-dlg" class="dlg">
  <h2>Revoke this result</h2>
  <p class="muted" id="revoke-pu"></p>
  <label class="fld"><span>Reason — required, and shown publicly on this polling unit</span>
    <textarea id="revoke-reason" rows="3"
      placeholder="e.g. figures do not match the physical result sheet"></textarea></label>
  <p id="revoke-err" class="login-err" hidden></p>
  <div class="dlg-actions">
    <button id="revoke-go" class="btn btn-primary">Revoke and remove from totals</button>
    <button class="btn btn-quiet" data-close>Cancel</button>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>

<script>
const API = '/api';
const BATCH = 120;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = new Intl.NumberFormat('en-NG');

let DATA = null;          // polling-units.json
let BD = {};              // puCode -> { uploads, status, results, reason, revokedFigures }
let PARTIES = [];         // column order
let rows = [];
let rendered = 0;
let adminToken = sessionStorage.getItem('irev2-admin') || '';
const isAdmin = () => !!adminToken;

function toast(msg, ms = 6000) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, ms);
}

const nameOf = (code) => DATA?.pus.find((p) => p[0] === code)?.[1] || code;

function statusOf(code) {
  const st = BD[code]?.status;
  if (st === 'added') return { key: 'added', label: 'Added' };
  if (st === 'revoked') return { key: 'revoked', label: 'Revoked' };
  return { key: 'none', label: 'Not added yet' };
}

/* ------------------------------- the table ------------------------------- */

/* For an ordinary visitor this is purely the tabulation: polling units down
   the side, parties across the top, totals underneath. Status and revoke are
   admin concerns and would only be noise in a public results table. */
function head() {
  const cols = ['<th class="pu">Polling Unit Name</th>']
    .concat(PARTIES.map((p) => `<th class="num">${esc(p)}</th>`));
  if (isAdmin()) cols.push('<th>Status</th>', '<th>Admin</th>');
  $('#head').innerHTML = cols.join('');
}

function rowHtml(pu) {
  const [code, name] = pu;
  const bd = BD[code];
  const res = (bd?.status === 'added' && bd.results) ? bd.results : null;
  const gone = bd?.status === 'revoked' ? (bd.revokedFigures || {}) : null;

  const cells = PARTIES.map((p) => {
    if (res && res[p] !== undefined) return `<td class="num">${nf.format(res[p])}</td>`;
    if (gone && gone[p] !== undefined) return `<td class="num struck">${nf.format(gone[p])}</td>`;
    return '<td class="num"></td>';
  });

  let extra = '';
  if (isAdmin()) {
    const st = statusOf(code);
    const why = (st.key === 'revoked' && bd?.reason) ? `<div class="why">“${esc(bd.reason)}”</div>` : '';
    extra = `<td><span class="pill pill-${st.key}">${st.label}</span>${why}</td>` +
      (st.key === 'added'
        ? `<td><button class="btn btn-small btn-revoke" data-revoke="${esc(code)}">Revoke</button></td>`
        : '<td><span class="muted">—</span></td>');
  }

  return `<tr data-code="${esc(code)}">
    <td class="pu"><strong>${esc(name)}</strong><br><span class="pu-code">${esc(code)}</span></td>
    ${cells.join('')}${extra}
  </tr>`;
}

// TOTAL counts only what is currently added, so it always reconciles with the
// figure on the front page.
function foot() {
  if (!PARTIES.length) { $('#foot').innerHTML = ''; return; }
  const totals = {};
  for (const bd of Object.values(BD)) {
    if (bd.status !== 'added') continue;
    for (const [p, v] of Object.entries(bd.results || {})) totals[p] = (totals[p] || 0) + v;
  }
  const cells = PARTIES.map((p) => `<td class="num">${nf.format(totals[p] || 0)}</td>`);
  const pad = isAdmin() ? '<td></td><td></td>' : '';
  $('#foot').innerHTML = `<tr><td class="pu">TOTAL</td>${cells.join('')}${pad}</tr>`;
}

function renderMore() {
  const slice = rows.slice(rendered, rendered + BATCH);
  if (!slice.length) { $('#more').textContent = ''; return; }
  $('#rows').insertAdjacentHTML('beforeend', slice.map(rowHtml).join(''));
  rendered += slice.length;
  $('#more').textContent = rendered < rows.length
    ? `Showing ${nf.format(rendered)} of ${nf.format(rows.length)} — scroll for more` : '';
}

function build() {
  const q = $('#q').value.trim().toUpperCase();
  const all = isAdmin() && $('#show-all').checked;

  rows = DATA.pus.filter(([code, name, wi]) => {
    if (!all) {
      const st = BD[code]?.status;
      // The public table is the tabulation of counted results. Admins also see
      // units that have photos but no counted result yet.
      const shown = isAdmin() ? !!BD[code] : st === 'added';
      if (!shown) return false;
    }
    if (!q) return true;
    return name.toUpperCase().includes(q) || code.includes(q) ||
           DATA.wards[wi][0].toUpperCase().includes(q);
  });

  rendered = 0;
  $('#rows').innerHTML = '';
  head();
  foot();
  renderMore();
  if (!rows.length) {
    $('#rows').innerHTML = `<tr><td class="pu" colspan="${PARTIES.length + 1 + (isAdmin() ? 2 : 0)}">
      <span class="muted">${q ? 'No polling unit matches that search.'
        : 'No results have been added to the totals yet.'}</span></td></tr>`;
  }
}

/* Revoked units are kept out of the tabulation -- they are not part of the
   count -- but listed underneath, so a withdrawal stays publicly visible
   rather than vanishing from the page. */
function withdrawn() {
  const list = Object.entries(BD).filter(([, b]) => b.status === 'revoked');
  $('#withdrawn').hidden = !list.length;
  if (!list.length) return;
  $('#withdrawn-list').innerHTML = list.map(([code, b]) => {
    const figs = Object.entries(b.revokedFigures || {}).sort((a, c) => c[1] - a[1])
      .map(([p, v]) => `${esc(p)} ${nf.format(v)}`).join(' · ');
    return `<div class="wd-row">
      <div><strong>${esc(nameOf(code))}</strong> <span class="pu-code">${esc(code)}</span>
        ${figs ? `<div class="pu-code">${figs}</div>` : ''}
        ${b.reason ? `<div class="why">“${esc(b.reason)}”</div>` : ''}
        ${b.revokedAt ? `<div class="pu-code">${new Date(b.revokedAt).toLocaleString()}</div>` : ''}
      </div></div>`;
  }).join('');
}

function describe() {
  const added = Object.values(BD).filter((b) => b.status === 'added').length;
  const revoked = Object.values(BD).filter((b) => b.status === 'revoked').length;
  if (!added && !revoked) {
    $('#intro').textContent = 'No results have been added to the totals yet. A polling unit appears ' +
      'here once two matching photos from two different phones are uploaded, or once an admin approves one.';
    return;
  }
  const bits = [`<strong>${added}</strong> polling unit${added === 1 ? '' : 's'} counted`];
  if (revoked) bits.push(`${revoked} withdrawn`);
  // With a full ballot the table is wider than any phone, so say so rather than
  // leaving people to discover the hidden columns by accident.
  const wide = PARTIES.length > 5
    ? ` Parties run alphabetically across ${PARTIES.length} columns — scroll the table sideways to see them all.`
    : ' Parties run in alphabetical order.';
  $('#intro').innerHTML = bits.join(' · ') +
    '. Figures below are the results read from the uploaded photos.' + wide;
}

async function load() {
  const [units, bd] = await Promise.all([
    fetch('/polling-units.json').then((r) => r.json()),
    fetch(`${API}/breakdown`).then((r) => r.json()),
  ]);
  DATA = units;
  BD = {};
  for (const r of bd.rows || []) BD[r.puCode] = r;

  // Fixed alphabetical order. A real election brings far more parties than any
  // sample, and columns must not shuffle as figures arrive -- a party has to
  // stay in the same place every time the page is loaded, so it can be found
  // by position rather than hunted for.
  const seen = new Set();
  for (const b of Object.values(BD)) {
    for (const p of Object.keys(b.results || {})) seen.add(p);
    // A revoked party only earns a column for admins, who can see those rows.
    if (isAdmin()) for (const p of Object.keys(b.revokedFigures || {})) seen.add(p);
  }
  PARTIES = [...seen].sort((a, b) =>
    a.localeCompare(b, 'en', { sensitivity: 'base', numeric: true }));

  describe();
  withdrawn();
  build();
}

/* ------------------------------- admin ---------------------------------- */

function refreshAdminUi() {
  $('#admin-flag').hidden = !isAdmin();
  $('#admin-login-btn').hidden = isAdmin();
  $('#admin-logout-btn').hidden = !isAdmin();
  $('#audit-btn').hidden = !isAdmin();
  $('#all-wrap').hidden = !isAdmin();
  if (!isAdmin()) {
    $('#audit').hidden = true;
    $('#audit-btn').textContent = 'View audit log';
    $('#show-all').checked = false;
  }
}

$('#admin-login-btn').addEventListener('click', () => {
  $('#login-err').hidden = true;
  $('#login-dlg').showModal();
});

$('#admin-logout-btn').addEventListener('click', async () => {
  adminToken = ''; sessionStorage.removeItem('irev2-admin');
  refreshAdminUi();
  await load();
  toast('Logged out of admin.');
});

$('#admin-go').addEventListener('click', async () => {
  const err = $('#login-err');
  err.hidden = true;
  try {
    const r = await fetch(`${API}/admin/login`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username: $('#admin-u').value, password: $('#admin-p').value }),
    });
    if (!r.ok) { err.textContent = 'Invalid username or password.'; err.hidden = false; return; }
    adminToken = (await r.json()).token;
    sessionStorage.setItem('irev2-admin', adminToken);
    $('#admin-p').value = '';
    $('#login-dlg').close();
    refreshAdminUi();
    await load();
    toast('Logged in as admin.');
  } catch {
    err.textContent = 'Could not reach the server. Please try again.';
    err.hidden = false;
  }
});

let revokeTarget = null;

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) { e.target.closest('dialog')?.close(); return; }
  const btn = e.target.closest('[data-revoke]');
  if (!btn) return;
  revokeTarget = btn.dataset.revoke;
  $('#revoke-pu').textContent = `${nameOf(revokeTarget)} · ${revokeTarget}`;
  $('#revoke-reason').value = '';
  $('#revoke-err').hidden = true;
  $('#revoke-dlg').showModal();
});

$('#revoke-go').addEventListener('click', async () => {
  const err = $('#revoke-err');
  const reason = $('#revoke-reason').value.trim();
  if (reason.length < 3) {
    err.textContent = 'Please give a reason — it is recorded against this result.';
    err.hidden = false;
    return;
  }
  const go = $('#revoke-go');
  go.disabled = true; go.textContent = 'Revoking…';
  try {
    const r = await fetch(`${API}/admin/revoke`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${adminToken}` },
      body: JSON.stringify({ puCode: revokeTarget, reason }),
    });
    if (r.status === 401) {
      adminToken = ''; sessionStorage.removeItem('irev2-admin');
      $('#revoke-dlg').close(); refreshAdminUi(); await load();
      toast('Your admin session expired. Please log in again.');
      return;
    }
    if (!r.ok) throw new Error('revoke failed');
    $('#revoke-dlg').close();
    toast('Revoked — the figures have been removed from the totals.');
    await load();
    if (!$('#audit').hidden) loadAudit();
  } catch {
    err.textContent = 'Could not revoke that result. Please try again.';
    err.hidden = false;
  } finally {
    go.disabled = false; go.textContent = 'Revoke and remove from totals';
  }
});

async function loadAudit() {
  const box = $('#audit');
  box.hidden = false;
  box.innerHTML = '<p class="muted">Loading audit log…</p>';
  const r = await fetch(`${API}/admin/audit`, { headers: { authorization: `Bearer ${adminToken}` } });
  if (!r.ok) { box.innerHTML = '<p class="muted">Could not load the audit log.</p>'; return; }
  const { entries } = await r.json();
  if (!entries.length) { box.innerHTML = '<p class="muted">No approvals or revocations recorded yet.</p>'; return; }
  box.innerHTML = '<h2>Audit log</h2>' + entries.map((e) => {
    const figs = Object.entries(e.figures || {}).sort((a, b) => b[1] - a[1])
      .map(([p, v]) => `${esc(p)} ${nf.format(v)}`).join(' · ');
    return `<div class="audit-row">
      <span class="pill pill-${e.action === 'revoke' ? 'revoked' : 'added'}">${esc(e.action)}</span>
      <div>
        <strong>${esc(nameOf(e.puCode))}</strong> <span class="pu-code">${esc(e.puCode)}</span><br>
        <span class="pu-code">${new Date(e.ts).toLocaleString()} · by ${esc(e.actor)}</span>
        ${e.reason ? `<div class="why">“${esc(e.reason)}”</div>` : ''}
        ${figs ? `<div class="pu-code">${figs}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

$('#audit-btn').addEventListener('click', () => {
  const box = $('#audit');
  if (box.hidden) { loadAudit(); $('#audit-btn').textContent = 'Hide audit log'; }
  else { box.hidden = true; $('#audit-btn').textContent = 'View audit log'; }
});

let debounce;
$('#q').addEventListener('input', () => {
  clearTimeout(debounce); debounce = setTimeout(build, 140);
});
$('#show-all').addEventListener('change', build);

new IntersectionObserver((en) => { if (en[0].isIntersecting && DATA) renderMore(); },
  { rootMargin: '400px' }).observe($('#sentinel'));

refreshAdminUi();
load().catch(() => { $('#intro').textContent = 'Could not load the breakdown. Please try again.'; });
</script>
</body>
</html>
