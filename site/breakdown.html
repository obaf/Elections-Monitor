<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Result breakdown — irev2.com</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="topbar">
  <span id="admin-flag" class="admin-flag" hidden>ADMIN MODE — you can revoke an added result</span>
  <a class="btn btn-small" href="/">← back to the portal</a>
  <button id="admin-login-btn" class="btn btn-small">admin login</button>
  <button id="admin-logout-btn" class="btn btn-small" hidden>log out</button>
</div>

<dialog id="login-dlg" class="dlg">
  <h2>Admin login</h2>
  <p class="muted">Log in to revoke a result that has been added.</p>
  <label class="fld"><span>Username</span>
    <input id="admin-u" type="text" autocomplete="username"></label>
  <label class="fld"><span>Password</span>
    <input id="admin-p" type="password" autocomplete="current-password"></label>
  <p id="login-err" class="login-err" hidden></p>
  <div class="dlg-actions">
    <button id="admin-go" class="btn btn-primary">Log in</button>
    <button class="btn btn-quiet" data-close>Cancel</button>
  </div>
</dialog>

<div class="page wide">
  <h1>Breakdown of results added to the totals</h1>
  <p class="muted" id="intro">Loading…</p>

  <div class="toolbar">
    <label class="grow">
      <span>Search polling unit or ward</span>
      <input id="q" type="search" placeholder="e.g. TOWN HALL IWARA" autocomplete="off">
    </label>
    <label class="chk">
      <input id="show-all" type="checkbox">
      Show every polling unit, including those with no photos
    </label>
  </div>

  <div class="scroller">
    <table class="bd">
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot id="foot"></tfoot>
    </table>
  </div>
  <div id="sentinel"></div>
  <p id="more" class="muted"></p>
</div>

<div id="toast" class="toast" hidden></div>

<script>
const API = '/api';
const BATCH = 120;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = new Intl.NumberFormat('en-NG');

let DATA = null;          // polling-units.json
let BD = {};              // puCode -> { uploads, status, results }
let PARTIES = [];         // column order
let rows = [];
let rendered = 0;
let adminToken = sessionStorage.getItem('irev2-admin') || '';
const isAdmin = () => !!adminToken;

function toast(msg, ms = 6000) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, ms);
}

/* Status is derived, not stored twice: a unit with no counter row has simply
   never had a photo, which reads the same as "not added yet". */
function statusOf(code) {
  const st = BD[code]?.status;
  if (st === 'added') return { key: 'added', label: 'Added' };
  if (st === 'revoked') return { key: 'revoked', label: 'Revoked' };
  return { key: 'none', label: 'Not added yet' };
}

function head() {
  const cols = ['<th class="pu">Polling Unit Name</th>']
    .concat(PARTIES.map((p) => `<th class="num">${esc(p)}</th>`));
  cols.push('<th>Status</th>');
  if (isAdmin()) cols.push('<th>Admin</th>');
  $('#head').innerHTML = cols.join('');
}

function rowHtml(pu) {
  const [code, name] = pu;
  const bd = BD[code];
  const res = (bd?.status === 'added' && bd.results) ? bd.results : null;
  const st = statusOf(code);

  const cells = PARTIES.map((p) => {
    const v = res?.[p];
    return `<td class="num">${v === undefined ? '' : nf.format(v)}</td>`;
  });

  let admin = '';
  if (isAdmin()) {
    admin = st.key === 'added'
      ? `<td><button class="btn btn-small" style="color:var(--accent);border-color:#e9b7b2"
             data-revoke="${esc(code)}">Revoke</button></td>`
      : `<td><span class="muted">—</span></td>`;
  }

  return `<tr data-code="${esc(code)}">
    <td class="pu"><strong>${esc(name)}</strong><br><span class="pu-code">${esc(code)}</span></td>
    ${cells.join('')}
    <td><span class="pill pill-${st.key}">${st.label}</span></td>
    ${admin}
  </tr>`;
}

function foot() {
  if (!PARTIES.length) { $('#foot').innerHTML = ''; return; }
  const totals = {};
  for (const [code, bd] of Object.entries(BD)) {
    if (bd.status !== 'added') continue;
    for (const [p, v] of Object.entries(bd.results || {})) totals[p] = (totals[p] || 0) + v;
  }
  const cells = PARTIES.map((p) => `<td class="num">${nf.format(totals[p] || 0)}</td>`);
  const extra = isAdmin() ? '<td></td><td></td>' : '<td></td>';
  $('#foot').innerHTML = `<tr><td class="pu">TOTAL</td>${cells.join('')}${extra}</tr>`;
}

function renderMore() {
  const slice = rows.slice(rendered, rendered + BATCH);
  if (!slice.length) { $('#more').textContent = ''; return; }
  $('#rows').insertAdjacentHTML('beforeend', slice.map(rowHtml).join(''));
  rendered += slice.length;
  $('#more').textContent = rendered < rows.length
    ? `Showing ${nf.format(rendered)} of ${nf.format(rows.length)} — scroll for more` : '';
}

function build() {
  const q = $('#q').value.trim().toUpperCase();
  const all = $('#show-all').checked;

  rows = DATA.pus.filter(([code, name, wi]) => {
    if (!all && !BD[code]) return false;          // no photos, nothing to show
    if (!q) return true;
    return name.toUpperCase().includes(q) || code.includes(q) ||
           DATA.wards[wi][0].toUpperCase().includes(q);
  });

  rendered = 0;
  $('#rows').innerHTML = '';
  head();
  foot();
  renderMore();
}

function describe() {
  const added = Object.values(BD).filter((b) => b.status === 'added').length;
  const revoked = Object.values(BD).filter((b) => b.status === 'revoked').length;
  const pending = Object.values(BD).filter((b) => b.status !== 'added' && b.status !== 'revoked').length;
  $('#intro').innerHTML = PARTIES.length || added
    ? `<strong>${added}</strong> polling unit${added === 1 ? '' : 's'} added to the totals · ` +
      `${revoked} revoked · ${pending} with photos but not yet added.`
    : 'No results have been added to the totals yet. A polling unit appears here once ' +
      'two matching photos from two different phones are uploaded, or once an admin approves one.';
}

async function load() {
  const [units, bd] = await Promise.all([
    fetch('/polling-units.json').then((r) => r.json()),
    fetch(`${API}/breakdown`).then((r) => r.json()),
  ]);
  DATA = units;
  BD = {};
  for (const r of bd.rows || []) BD[r.puCode] = r;

  // Columns ordered by size, so the parties that matter read left to right.
  const sums = {};
  for (const b of Object.values(BD)) {
    if (b.status !== 'added') continue;
    for (const [p, v] of Object.entries(b.results || {})) sums[p] = (sums[p] || 0) + v;
  }
  PARTIES = Object.keys(sums).sort((a, b) => sums[b] - sums[a]);

  describe();
  build();
}

/* ------------------------------- admin ---------------------------------- */

function refreshAdminUi() {
  $('#admin-flag').hidden = !isAdmin();
  $('#admin-login-btn').hidden = isAdmin();
  $('#admin-logout-btn').hidden = !isAdmin();
}

$('#admin-login-btn').addEventListener('click', () => {
  $('#login-err').hidden = true;
  $('#login-dlg').showModal();
});

$('#admin-go').addEventListener('click', async () => {
  const err = $('#login-err');
  err.hidden = true;
  try {
    const r = await fetch(`${API}/admin/login`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username: $('#admin-u').value, password: $('#admin-p').value }),
    });
    if (!r.ok) { err.textContent = 'Invalid username or password.'; err.hidden = false; return; }
    adminToken = (await r.json()).token;
    sessionStorage.setItem('irev2-admin', adminToken);
    $('#admin-p').value = '';
    $('#login-dlg').close();
    refreshAdminUi();
    build();
    toast('Logged in as admin. You can now revoke an added result.');
  } catch {
    err.textContent = 'Could not reach the server. Please try again.';
    err.hidden = false;
  }
});

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) e.target.closest('dialog')?.close();
});

$('#admin-logout-btn').addEventListener('click', () => {
  adminToken = ''; sessionStorage.removeItem('irev2-admin');
  refreshAdminUi(); build();
  toast('Logged out of admin.');
});

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-revoke]');
  if (!btn) return;
  const code = btn.dataset.revoke;
  const name = DATA.pus.find((p) => p[0] === code)?.[1] || code;
  if (!confirm(`Remove the result for "${name}" from the totals?`)) return;

  btn.disabled = true; btn.textContent = 'Revoking…';
  try {
    const r = await fetch(`${API}/admin/revoke`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${adminToken}` },
      body: JSON.stringify({ puCode: code }),
    });
    if (r.status === 401) {
      adminToken = ''; sessionStorage.removeItem('irev2-admin');
      refreshAdminUi(); build();
      toast('Your admin session expired. Log in again from the portal.');
      return;
    }
    if (!r.ok) throw new Error('revoke failed');
    toast('Revoked — the figures have been removed from the totals.');
    await load();
  } catch {
    btn.disabled = false; btn.textContent = 'Revoke';
    toast('Could not revoke that result. Please try again.');
  }
});

let debounce;
$('#q').addEventListener('input', () => {
  clearTimeout(debounce); debounce = setTimeout(build, 140);
});
$('#show-all').addEventListener('change', build);

new IntersectionObserver((en) => { if (en[0].isIntersecting && DATA) renderMore(); },
  { rootMargin: '400px' }).observe($('#sentinel'));

refreshAdminUi();
load().catch(() => { $('#intro').textContent = 'Could not load the breakdown. Please try again.'; });
</script>
</body>
</html>
